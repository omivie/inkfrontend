    <main id="main-content" class="site-main">
        <section class="auth-page">
            <!-- Photo half of the split (owner 2026-11-26, ERR-398): the ink photo
                 framed like a print proof. Decorative, so hidden from screen readers. -->
            <div class="auth-art" aria-hidden="true">
                <span class="auth-art__marks"></span>
                <div class="auth-art__caption">
                    <p class="auth-art__title">Ink and toner for New Zealand printers.</p>
                    <p class="auth-art__note">NZ owned &amp; operated since 2008</p>
                </div>
            </div>
            <div class="container container--narrow">
                <div class="auth-form-wrapper" id="forgot-password-wrapper">
                    <h1 class="auth-form__heading">Reset your password</h1>
                    <p class="auth-form__subheading">Enter your email address and we'll send you a link to reset your password.</p>

                    <form class="auth-form" id="forgot-password-form" novalidate>
                        <div class="form-group">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" id="email" class="form-input" placeholder=" " required autocomplete="email">
                            <span id="email-error" class="form-error" hidden></span>
                        </div>

                        <button type="submit" class="btn btn--primary btn--large btn--full-width">
                            Send reset link
                        </button>
                    </form>

                    <p class="auth-form__switch">
                        Remember your password? <a href="/account/login">Sign in</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
